<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>원천세 실무 실습</title>
<style>body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;900&family=Noto+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 팔레트 근거: 관공서 서식 용지(회백 종이) + 먹물 잉크(남색-검정) + 관인 인주(적색, 수정신고 시 "수정 전=빨강/수정 후=검정" 실무 관행과 동일하게 오류·수정에만 사용) */
:root{
  --bg:#edece4; --panel:#fffdf8; --ink:#1c2431; --sub:#5c6472; --line:#d6d2c4;
  --accent:#1f3f66; --accent-ink:#f4f6fa; --accent-soft:#e2e8f0;
  --good:#2f6b46; --good-bg:#e6f0e8; --bad:#a5382a; --bad-bg:#f8e9e5;
  --lock:#bdb9ab; --field-num-bg:#1f3f66; --field-num-ink:#f4f6fa;
  --radius:10px;
  --font-display:'Noto Serif KR',serif; --font-body:'Noto Sans KR',-apple-system,sans-serif; --font-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171b22; --panel:#20252e; --ink:#eceef3; --sub:#98a1b0; --line:#333a46;
    --accent:#7fa0c9; --accent-ink:#101822; --accent-soft:#243247;
    --good:#7fc79b; --good-bg:#1c2f24; --bad:#e2897c; --bad-bg:#33221e;
    --lock:#454c58; --field-num-bg:#7fa0c9; --field-num-ink:#101822;
  }
}
:root[data-theme="dark"]{
  --bg:#171b22; --panel:#20252e; --ink:#eceef3; --sub:#98a1b0; --line:#333a46;
  --accent:#7fa0c9; --accent-ink:#101822; --accent-soft:#243247;
  --good:#7fc79b; --good-bg:#1c2f24; --bad:#e2897c; --bad-bg:#33221e;
  --lock:#454c58; --field-num-bg:#7fa0c9; --field-num-ink:#101822;
}
*{box-sizing:border-box;}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);}
h1,h2,h3{margin:0 0 8px;line-height:1.35;font-family:var(--font-display);text-wrap:balance;}
p{line-height:1.6;margin:0 0 10px;}
input,select,button{font-family:var(--font-body);}
input[type=text],input[type=number]{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
table.datatable{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
table.datatable th{font-family:var(--font-body);}

.wrap{max-width:760px;margin:0 auto;padding:12px 12px 80px;}

/* header / progress */
.appbar{position:sticky;top:0;background:var(--bg);z-index:20;padding:10px 0 6px;border-bottom:1px solid var(--line);}
.appbar h1{font-size:17px;}
.appbar .sub{color:var(--sub);font-size:12.5px;}
.steps{display:flex;gap:6px;overflow-x:auto;padding:10px 2px 4px;-webkit-overflow-scrolling:touch;}
.step{flex:0 0 auto;min-width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid var(--line);color:var(--sub);background:var(--panel);}
.step.done{background:var(--good);border-color:var(--good);color:#fff;}
.step.current{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
.step.locked{color:var(--lock);border-color:var(--line);}
.steps-label{font-size:11.5px;color:var(--sub);text-align:center;margin-top:2px;}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:14px 0;}
.card.scenario{background:var(--accent-soft);border-color:var(--accent-soft);}
.badge{display:inline-block;font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;margin-bottom:8px;}
.month-tag{color:var(--accent);font-weight:700;font-size:13px;}
.note{font-size:12.5px;color:var(--sub);background:var(--panel);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin:8px 0;}

/* form fields */
.field{display:flex;align-items:flex-start;gap:10px;margin:10px 0;}
.fnum{flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:var(--field-num-bg);color:var(--field-num-ink);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px;}
.fbody{flex:1;min-width:0;}
.flabel{font-size:13.5px;font-weight:600;margin-bottom:4px;}
.fhint{font-size:12px;color:var(--sub);margin-bottom:4px;}
input[type=text],input[type=number],select{
  width:100%;padding:10px 12px;font-size:15px;border-radius:10px;border:1.5px solid var(--line);
  background:var(--panel);color:var(--ink);min-height:44px;
}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;}
.radio-row,.check-row{display:flex;flex-wrap:wrap;gap:8px;}
.radio-row label,.check-row label{
  display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:10px;
  padding:9px 12px;font-size:13.5px;min-height:44px;cursor:pointer;background:var(--panel);
}
.radio-row input,.check-row input{width:18px;height:18px;flex:0 0 auto;}

/* form-table for official document replicas */
.doc{border:1.5px solid var(--accent);border-radius:6px;overflow:hidden;margin:10px 0;font-size:12.5px;}
.doc-title{background:var(--accent);color:var(--accent-ink);text-align:center;padding:8px;font-weight:700;font-family:var(--font-display);font-size:14.5px;letter-spacing:.02em;}
.doc-sub{background:var(--accent-soft);text-align:center;padding:5px;font-size:11.5px;color:var(--sub);font-weight:600;}
.doc-row{display:flex;border-top:1px solid var(--line);}
.doc-row:first-child{border-top:none;}
.doc-cell{padding:8px 10px;flex:1;border-right:1px solid var(--line);}
.doc-cell:last-child{border-right:none;}
.doc-cell.label{background:var(--accent-soft);flex:0 0 128px;font-weight:700;font-size:12px;display:flex;align-items:center;}
.doc-cell input{min-height:38px;font-size:13.5px;padding:6px 8px;}
@media (max-width:480px){
  .doc-row{flex-direction:column;}
  .doc-cell.label{flex:0 0 auto;}
}

table.datatable{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0;}
table.datatable th,table.datatable td{border:1px solid var(--line);padding:6px 8px;text-align:center;}
table.datatable th{background:var(--accent-soft);}
table.wontable{min-width:520px;}
table.wontable td,table.wontable th{padding:5px;font-size:11.5px;}
table.wontable td input{min-height:38px;padding:5px 6px;font-size:12.5px;width:100%;}
table.wontable tr.total-row{background:var(--accent-soft);}
table.datatable caption{caption-side:top;text-align:left;font-family:var(--font-body);font-weight:600;font-size:13px;margin-bottom:6px;}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}

/* buttons */
.btnrow{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
button{
  min-height:46px;padding:10px 18px;border-radius:10px;border:none;font-size:15px;font-weight:700;
  cursor:pointer;background:var(--accent);color:var(--accent-ink);
}
button.secondary{background:var(--panel);color:var(--ink);border:1.5px solid var(--line);}
button:disabled{opacity:.5;cursor:not-allowed;}

/* feedback */
.result{border-radius:12px;padding:14px;margin-top:14px;}
.result.pass{background:var(--good-bg);border:1.5px solid var(--good);}
.result.fail{background:var(--bad-bg);border:1.5px solid var(--bad);}
.result h3{margin-bottom:6px;}
.result.pass h3{color:var(--good);}
.result.fail h3{color:var(--bad);}
.explain{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px;}
.explain-item{font-size:12.5px;margin:6px 0;padding:8px 10px;border-radius:8px;background:var(--panel);}
.explain-item.wrong{border-left:3px solid var(--bad);}
.explain-item.right{border-left:3px solid var(--good);}
.explain-item b{display:block;margin-bottom:2px;}

.locked-note{color:var(--sub);font-size:13px;text-align:center;padding:40px 20px;}
.footer-note{color:var(--sub);font-size:11.5px;text-align:center;margin-top:24px;}
.score-pill{display:inline-block;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;margin-left:6px;}
</style>

<div class="wrap">
  <div class="appbar">
    <h1>원천세 실무 실습 &mdash; (주)끌림상사 1년 사이클</h1>
    <div class="sub">모듈을 통과해야 다음 단계로 넘어갈 수 있습니다 · 입력한 내용은 자동 저장됩니다</div>
    <div class="steps" id="stepsBar"></div>
    <div class="steps-label" id="stepsLabel"></div>
  </div>
  <div id="content"></div>
  <div class="footer-note">실습용 학습 프로그램 · 실제 신고 시에는 최신 법령과 국세청 홈택스 안내를 반드시 확인하세요.</div>
</div>

<script>
(function(){
"use strict";

/* ---------------- persistence ---------------- */
function loadJSON(key, fallback){
  try{ var raw = localStorage.getItem(key); if(raw) return JSON.parse(raw); }catch(e){}
  return fallback;
}
function saveJSON(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

var progress = loadJSON('wonchunse_progress_v2', {passed:0});
var answers  = loadJSON('wonchunse_answers_v2', {});
function saveProgress(){ saveJSON('wonchunse_progress_v2', progress); }
function saveAnswers(){ saveJSON('wonchunse_answers_v2', answers); }

var state = { current: 0 };

/* ---------------- helpers ---------------- */
function won(n){ return Number(n).toLocaleString('ko-KR'); }
function num(v){
  if(v===null||v===undefined) return NaN;
  var s = String(v).replace(/[,\s원]/g,'').trim();
  if(s==='') return NaN;
  return Number(s);
}
function within(actual, expected, tol){
  if(isNaN(actual)) return false;
  tol = tol===undefined ? Math.max(10, Math.round(Math.abs(expected)*0.01)) : tol;
  return Math.abs(actual-expected) <= tol;
}
function el(tag, attrs, children){
  var e = document.createElement(tag);
  attrs = attrs||{};
  for(var k in attrs){
    if(k==='html'){ e.innerHTML = attrs[k]; }
    else if(k==='class'){ e.className = attrs[k]; }
    else{ e.setAttribute(k, attrs[k]); }
  }
  (children||[]).forEach(function(c){ if(c) e.appendChild(c); });
  return e;
}
function text(t){ return document.createTextNode(t); }

function attachComma(input){
  input.addEventListener('input', function(){
    var posFromEnd = input.value.length - input.selectionStart;
    var neg = input.value.trim().charAt(0)==='-';
    var digits = input.value.replace(/[^0-9]/g,'').replace(/^0+(?=\d)/,'');
    var out = digits ? Number(digits).toLocaleString('en-US') : '';
    input.value = (neg && out ? '-' : '') + out;
    var newPos = Math.max(0, input.value.length - posFromEnd);
    try{ input.setSelectionRange(newPos, newPos); }catch(e){}
  });
}
function bindPersistValue(input, id){
  if(answers[id]!==undefined) input.value = answers[id];
  var evt = (input.tagName==='SELECT') ? 'change' : 'input';
  input.addEventListener(evt, function(){ answers[id]=input.value; saveAnswers(); });
}
function bindPersistChecked(input, id, val){
  if(answers[id]!==undefined && answers[id]===val) input.checked = true;
  input.addEventListener('change', function(){ if(input.checked){ answers[id]=val; saveAnswers(); } });
}
function bindPersistCheckbox(input, id){
  if(answers[id]) input.checked = true;
  input.addEventListener('change', function(){ answers[id]=input.checked; saveAnswers(); });
}

/* generic field builders (return {wrap, get}) */
function dataTable(caption, headers, rows){
  var wrap = el('div',{class:'table-scroll'});
  var html = '<caption>'+caption+'</caption><tr>'+headers.map(function(h){return '<th>'+h+'</th>';}).join('')+'</tr>';
  rows.forEach(function(r){ html += '<tr>'+r.map(function(c){return '<td>'+c+'</td>';}).join('')+'</tr>'; });
  wrap.appendChild(el('table',{class:'datatable',html:html}));
  return wrap;
}
function scenarioCard(mod){
  var wrap = el('div',{class:'card scenario'});
  wrap.appendChild(el('div',{class:'flabel',style:'font-size:14px'},[text('시나리오')]));
  if(mod.scenarioHtml) wrap.appendChild(el('div',{html:mod.scenarioHtml}));
  if(mod.scenarioTable) wrap.appendChild(mod.scenarioTable());
  return wrap;
}
function fieldShell(numLabel, label, hint){
  var wrap = el('div',{class:'field'});
  wrap.appendChild(el('div',{class:'fnum'},[text(numLabel)]));
  var body = el('div',{class:'fbody'});
  body.appendChild(el('div',{class:'flabel'},[text(label)]));
  if(hint) body.appendChild(el('div',{class:'fhint'},[text(hint)]));
  wrap.appendChild(body);
  return {wrap:wrap, body:body};
}
function numberField(id, numLabel, label, hint){
  var s = fieldShell(numLabel, label, hint);
  var input = el('input',{type:'text', inputmode:'decimal', placeholder:'숫자 입력'});
  attachComma(input); bindPersistValue(input, id);
  s.body.appendChild(input);
  return {wrap:s.wrap, get:function(){ return num(input.value); }, input:input};
}
function textField(id, numLabel, label, hint, placeholder){
  var s = fieldShell(numLabel, label, hint);
  var input = el('input',{type:'text', placeholder: placeholder||'입력'});
  bindPersistValue(input, id);
  s.body.appendChild(input);
  return {wrap:s.wrap, get:function(){ return input.value.trim(); }, input:input};
}
function selectField(id, numLabel, label, hint, options){
  var s = fieldShell(numLabel, label, hint);
  var sel = el('select',{});
  sel.appendChild(el('option',{value:''},[text('선택하세요')]));
  options.forEach(function(o){ sel.appendChild(el('option',{value:o}, [text(o)])); });
  bindPersistValue(sel, id);
  s.body.appendChild(sel);
  return {wrap:s.wrap, get:function(){ return sel.value; }, input:sel};
}
function radioField(id, numLabel, label, hint, options){
  var s = fieldShell(numLabel, label, hint);
  var row = el('div',{class:'radio-row'});
  options.forEach(function(o){
    var lab = el('label',{});
    var r = el('input',{type:'radio', name:id});
    bindPersistChecked(r, id, o);
    lab.appendChild(r); lab.appendChild(text(o));
    row.appendChild(lab);
  });
  s.body.appendChild(row);
  return {wrap:s.wrap, get:function(){ var c=row.querySelector('input:checked'); return c?c.parentNode.textContent:null; }};
}
function toggleField(numLabel, label, id, optA, optB){
  /* binary 과세/비과세 style toggle, returns get() -> 'A'|'B'|null */
  var s = fieldShell(numLabel, label, null);
  var row = el('div',{class:'radio-row'});
  var labA = el('label',{}); var rA = el('input',{type:'radio',name:id});
  bindPersistChecked(rA, id, 'A'); labA.appendChild(rA); labA.appendChild(text(optA));
  var labB = el('label',{}); var rB = el('input',{type:'radio',name:id});
  bindPersistChecked(rB, id, 'B'); labB.appendChild(rB); labB.appendChild(text(optB));
  row.appendChild(labA); row.appendChild(labB);
  s.body.appendChild(row);
  return {wrap:s.wrap, get:function(){ if(rA.checked) return 'A'; if(rB.checked) return 'B'; return null; }};
}
function checkboxField(numLabel, label, id, checked0){
  var s = fieldShell(numLabel, label, null);
  var lab = el('label',{});
  var c = el('input',{type:'checkbox'});
  bindPersistCheckbox(c, id);
  lab.appendChild(c); lab.appendChild(text(checked0));
  s.body.appendChild(el('div',{class:'check-row'},[lab]));
  return {wrap:s.wrap, get:function(){ return c.checked; }};
}

/* 원천징수이행상황신고서 실제 서식(별지 제21호) "❶ 원천징수 명세 및 납부세액" 표를 그대로 옮긴 그리드.
   근로소득 하위 코드(A01~A06)를 항상 전부 노출해 실습생이 해당 월에 어떤 코드에 입력해야 하는지
   스스로 구분하도록 한다. 상단은 ①귀속연월 ②지급연월만 선택. 가감계(A10)는 자동 합산된다. */
function mkTableInput(id){
  var input = el('input',{type:'text', inputmode:'decimal', placeholder:'0'});
  input.style.minWidth = '82px';
  attachComma(input); bindPersistValue(input, id);
  return input;
}
var WONCHUN_ROWS = [
  {code:'A01', label:'간이세액', group:null},
  {code:'A02', label:'중도퇴사', group:null},
  {code:'A03', label:'일용근로', group:null},
  {code:'A04', label:'합계', group:'연말정산'},
  {code:'A05', label:'분납신청', group:'연말정산'},
  {code:'A06', label:'납부금액', group:'연말정산'}
];
function renderWonchunDoc(host, cfg){
  /* cfg.blocks: [{category, rowsData, totalCode, totalLabel, skipTotal, activeCodes}, ...]
     소득종류 여러 개를 한 신고서에 함께 신고하는 실무를 재현하기 위해 블록을 여러 개 쌓을 수 있다.
     구버전 호출(cfg.category/rowsData/totalCode/...)은 블록 1개짜리로 자동 변환한다. */
  var blocks = cfg.blocks || [{
    category: cfg.category||'근로소득',
    rowsData: cfg.rowsData||WONCHUN_ROWS,
    totalCode: cfg.totalCode||'A10',
    totalLabel: cfg.totalLabel||'가감계',
    skipTotal: cfg.skipTotal,
    activeCodes: cfg.activeCodes
  }];
  var doc = el('div',{class:'card doc'});
  doc.appendChild(el('div',{class:'doc-title'},[text(cfg.title || '원천징수이행상황신고서')]));
  var catLabel = blocks.map(function(b){return b.category;}).join(' · ');
  doc.appendChild(el('div',{class:'doc-sub'},[text('❶ 원천징수 명세 및 납부세액 ('+catLabel+')')]));
  function headerRow(labelHtml, controlEl){
    var row = el('div',{class:'doc-row'});
    row.appendChild(el('div',{class:'doc-cell label'},[text(labelHtml)]));
    var cell = el('div',{class:'doc-cell'}); cell.appendChild(controlEl); row.appendChild(cell);
    doc.appendChild(row);
  }
  var fGwiwol = selectField(cfg.idPrefix+'_gwiwol','①','귀속연월',null, cfg.months);
  headerRow('① 귀속연월', fGwiwol.wrap.querySelector('select'));
  var fJigwol = selectField(cfg.idPrefix+'_jigwol','②','지급연월',null, cfg.months);
  headerRow('② 지급연월', fJigwol.wrap.querySelector('select'));
  var allActive = [];
  blocks.forEach(function(b){ if(b.activeCodes) allActive = allActive.concat(b.activeCodes); });
  if(allActive.length){
    doc.appendChild(el('div',{class:'note'},[text('이번 시나리오에서 실제로 값이 발생하는 코드: '+allActive.join(', ')+' (나머지는 0으로 둡니다)')]));
  }

  var scroll = el('div',{class:'table-scroll'});
  var table = el('table',{class:'datatable wontable'});
  var thead = document.createElement('thead');
  var tr1 = document.createElement('tr');
  tr1.innerHTML = '<th rowspan="2">소득자<br>소득구분</th><th rowspan="2"></th><th rowspan="2">세부구분</th><th rowspan="2">코드</th><th colspan="2">소득지급<br><span style="font-weight:400;font-size:10px">(과세미달·비과세 포함)</span></th><th>징수세액</th>';
  var tr2 = document.createElement('tr');
  tr2.innerHTML = '<th>④인원</th><th>⑤총지급액</th><th>⑥소득세등</th>';
  thead.appendChild(tr1); thead.appendChild(tr2);
  table.appendChild(thead);

  var tbody = document.createElement('tbody');
  var rowRefs = [];        /* flat, across all blocks */
  var totalSpans = {};     /* totalCode -> {inwon,jigup,se elements, rows:[...]} */
  blocks.forEach(function(block){
    var ROWS = block.rowsData;
    var ynSpanDone = false, ynSpanGroup = null;
    var blockRowRefs = [];
    ROWS.forEach(function(r, i){
      var tr = document.createElement('tr');
      if(i===0){
        var tdCat = document.createElement('td');
        tdCat.textContent = block.category; tdCat.rowSpan = ROWS.length;
        tdCat.style.fontWeight = '700';
        tr.appendChild(tdCat);
      }
      if(r.group){
        if(!ynSpanDone || r.group!==ynSpanGroup){
          var tdGroup = document.createElement('td');
          tdGroup.textContent = r.group; tdGroup.rowSpan = ROWS.filter(function(x){return x.group===r.group;}).length;
          tdGroup.style.fontWeight='700';
          tr.appendChild(tdGroup);
          ynSpanDone = true; ynSpanGroup = r.group;
        }
      } else {
        var tdBlank = document.createElement('td'); tr.appendChild(tdBlank);
      }
      var tdLabel = document.createElement('td'); tdLabel.textContent = r.label; tr.appendChild(tdLabel);
      var tdCode = document.createElement('td'); tdCode.textContent = r.code; tr.appendChild(tdCode);
      var tdInwon = document.createElement('td'); var inInwon = mkTableInput(cfg.idPrefix+'_'+r.code+'_inwon'); tdInwon.appendChild(inInwon); tr.appendChild(tdInwon);
      var tdJigup = document.createElement('td'); var inJigup = mkTableInput(cfg.idPrefix+'_'+r.code+'_jigup'); tdJigup.appendChild(inJigup); tr.appendChild(tdJigup);
      var tdSe = document.createElement('td'); var inSe = mkTableInput(cfg.idPrefix+'_'+r.code+'_se'); tdSe.appendChild(inSe); tr.appendChild(tdSe);
      if(block.activeCodes && block.activeCodes.indexOf(r.code)>=0){ tr.style.background = 'var(--accent-soft)'; }
      tbody.appendChild(tr);
      var ref = {code:r.code, inwon:inInwon, jigup:inJigup, se:inSe};
      rowRefs.push(ref); blockRowRefs.push(ref);
    });
    if(!block.skipTotal){
      var trTotal = document.createElement('tr'); trTotal.className = 'total-row';
      var tdTotalLabel = document.createElement('td'); tdTotalLabel.textContent = block.totalLabel; tdTotalLabel.colSpan = 3; tdTotalLabel.style.fontWeight = '700'; trTotal.appendChild(tdTotalLabel);
      var tdTotalCode = document.createElement('td'); tdTotalCode.textContent = block.totalCode; tdTotalCode.style.fontWeight = '700'; trTotal.appendChild(tdTotalCode);
      var spanInwon = document.createElement('td'); spanInwon.style.fontWeight = '700';
      var spanJigup = document.createElement('td'); spanJigup.style.fontWeight = '700';
      var spanSe = document.createElement('td'); spanSe.style.fontWeight = '700';
      trTotal.appendChild(spanInwon); trTotal.appendChild(spanJigup); trTotal.appendChild(spanSe);
      tbody.appendChild(trTotal);
      totalSpans[block.totalCode] = {inwon:spanInwon, jigup:spanJigup, se:spanSe, rows:blockRowRefs};
    }
  });
  table.appendChild(tbody);
  scroll.appendChild(table);
  doc.appendChild(scroll);
  blocks.forEach(function(block){
    if(!block.skipTotal) doc.appendChild(el('div',{class:'doc-sub'},[text(block.totalCode+'('+block.totalLabel+')는 '+block.category+' 행의 합계로 자동 계산됩니다')]));
  });
  host.appendChild(doc);

  function recalc(){
    Object.keys(totalSpans).forEach(function(code){
      var t = totalSpans[code];
      var si=0, sj=0, ss=0;
      t.rows.forEach(function(r){ si += num(r.inwon.value)||0; sj += num(r.jigup.value)||0; ss += num(r.se.value)||0; });
      t.inwon.textContent = won(si);
      t.jigup.textContent = won(sj);
      t.se.textContent = won(ss);
    });
  }
  rowRefs.forEach(function(r){ [r.inwon,r.jigup,r.se].forEach(function(inp){ inp.addEventListener('input', recalc); }); });
  recalc();

  function totalOf(code){
    var t = totalSpans[code];
    if(!t) return {inwon:0,jigup:0,se:0};
    var si=0, sj=0, ss=0;
    t.rows.forEach(function(r){ si += num(r.inwon.value)||0; sj += num(r.jigup.value)||0; ss += num(r.se.value)||0; });
    return {inwon:si, jigup:sj, se:ss};
  }

  return {
    gwiwol:function(){ return fGwiwol.get(); },
    jigwol:function(){ return fJigwol.get(); },
    row:function(code){ var r = rowRefs.filter(function(x){return x.code===code;})[0];
      return { inwon:function(){return num(r.inwon.value);}, jigup:function(){return num(r.jigup.value);}, se:function(){return num(r.se.value);} };
    },
    total:function(code){ return totalOf(code); },
    totalInwon:function(){ return totalOf(blocks[0].totalCode).inwon; },
    totalJigup:function(){ return totalOf(blocks[0].totalCode).jigup; },
    totalSe:function(){ return totalOf(blocks[0].totalCode).se; }
  };
}

function showResult(container, correct, totalCount, details, onPass, threshold){
  container.innerHTML = '';
  var pass = correct >= threshold;
  var box = el('div',{class:'result '+(pass?'pass':'fail')});
  var h = el('h3',{});
  h.appendChild(text((pass?'통과했습니다':'다시 확인해 보세요')+' '));
  h.appendChild(el('span',{class:'score-pill'},[text(correct+' / '+totalCount)]));
  box.appendChild(h);
  var exp = el('div',{class:'explain'});
  details.forEach(function(d){
    var item = el('div',{class:'explain-item '+(d.ok?'right':'wrong')});
    item.appendChild(el('b',{},[text((d.ok?'✓ ':'✗ ')+d.label)]));
    item.appendChild(text(d.law||''));
    exp.appendChild(item);
  });
  box.appendChild(exp);
  container.appendChild(box);
  if(pass){
    var btn = el('button',{},[text('다음 모듈로 이동 →')]);
    btn.onclick = onPass;
    container.appendChild(el('div',{class:'btnrow'},[btn]));
    if(container.nextSibling && container.nextSibling.classList && container.nextSibling.classList.contains('btnrow')){
      container.nextSibling.style.display = 'none';
    }
  }
}

/* ================= app shell ================= */
function renderSteps(){
  var bar = document.getElementById('stepsBar');
  bar.innerHTML = '';
  MODULES.forEach(function(m,i){
    var cls = 'step';
    if(i < progress.passed) cls += ' done';
    else if(i === state.current) cls += ' current';
    else cls += ' locked';
    var s = el('div',{class:cls},[text(String(i+1))]);
    s.onclick = function(){
      if(i <= progress.passed){ state.current = i; renderAll(); window.scrollTo({top:0,behavior:'smooth'}); }
    };
    bar.appendChild(s);
  });
  document.getElementById('stepsLabel').textContent = (state.current+1)+' / '+MODULES.length+' · '+MODULES[state.current].month+' · '+MODULES[state.current].title;
}
function renderAll(){
  renderSteps();
  var host = document.getElementById('content');
  host.innerHTML = '';
  var mod = MODULES[state.current];
  if(state.current > progress.passed){
    host.appendChild(el('div',{class:'card'},[el('div',{class:'locked-note'},[text('🔒 이전 모듈을 먼저 통과해야 열립니다.')])]));
    return;
  }
  if(state.current === MODULES.length-1 && progress.passed >= MODULES.length){
    host.appendChild(el('div',{class:'card scenario'},[
      el('span',{class:'badge'},[text('완료')]),
      el('h2',{},[text('축하합니다! 전체 과정을 완료했습니다')]),
      el('p',{},[text('(주)끌림상사의 1년 원천세 신고 사이클을 처음부터 끝까지 모두 통과했습니다. 급여대장 작성, 비과세 판단, 4대보험, 간이세액표, 원천징수이행상황신고서, 일용근로소득, 중도퇴사·퇴직소득, 간이지급명세서, 사업·기타소득 구분, 이자·배당소득, 연말정산까지 실무 흐름을 모두 실습하셨습니다.')])
    ]));
    var backBtn = el('button',{class:'secondary'},[text('처음 모듈부터 다시 살펴보기')]);
    backBtn.onclick = function(){ state.current = 0; renderAll(); window.scrollTo({top:0,behavior:'smooth'}); };
    host.appendChild(el('div',{class:'btnrow'},[backBtn]));
    return;
  }
  var titleWrap = el('div',{});
  titleWrap.appendChild(el('div',{class:'month-tag'},[text(mod.month)]));
  titleWrap.appendChild(el('h2',{},[text(mod.title)]));
  host.appendChild(titleWrap);
  mod.render(host, function(){
    if(progress.passed <= state.current){ progress.passed = state.current+1; saveProgress(); }
    if(state.current < MODULES.length-1){ state.current++; }
    renderAll();
    window.scrollTo({top:0, behavior:'smooth'});
  });
}
state.current = Math.min(progress.passed, MODULES.length-1);
renderAll();
})();
